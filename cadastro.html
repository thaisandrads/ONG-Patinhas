<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="js/form.js" defer></script>
    <script src="js/main.js" defer></script>

       <title>Faça seu cadastro</title>
</head>
<body>

    <header><h1>Seja um doador:</h1></header>


<nav>
    <button class="menu-toggle" aria-label="Abrir menu">☰</button>

    <div class="menu-links">
        <a href="index.html">Início</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="projetos.html">Projetos</a>
    </div>
</nav>

<main>

<form id="formCadastro" novalidate> <!-- novalidate significa: Não faça automaticamente a validação visual padrão desse formulário.-->
    
    <fieldset>
        <legend>Dados pessoais</legend>
          <label for="nome">Nome completo:</label>
          <input type="text" name="nome" id="nome" required placeholder=" ">
          <p id="erroNome"></p>
          
          <label for="cpf">CPF:</label>
          <input type="text" name="cpf" id="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder=" ">
            <p id="erroCpf" class="erro-campo"></p>

          
          <label for="telefone">Telefone:</label>
          <input type="tel" name="telefone" id="telefone" required pattern="\(\d{2}\)\d{5}-\d{4}" placeholder=" ">
          <p id="erroTelefone"></p>

          <label for="cep">Cep:</label>
          <input type="text" name="cep" id="cep" required pattern="\d{5}-\d{3}" placeholder=" ">
          <p id="erroCep"></p>
          
          <label for="email">E-mail:</label>
          <input
            type="email"
            name="email"
            id="email"
            required
            placeholder=" "
        >
        <p id="erroEmail" class="erro-campo"></p>
        
    </fieldset>

 <input type="submit" value="Enviar">
 <p id="mensagem"></p>

</form>
</main>

</body>
</html>
